name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: تثبيت حزم npm
        run: npm install

      - name: مزامنة الكود مع مشروع أندرويد
        run: npx cap sync android

      - name: منح صلاحية التنفيذ لـ Gradle
        run: chmod +x android/gradlew

      - name: بناء APK (نسخة Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: رفع ملف APK كمخرج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Coiffeur-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
